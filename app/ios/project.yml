name: EmojiChat
options:
  bundleIdPrefix: com.framna
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  EmojiModel:
    path: EmojiModel
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  EmojiChat:
    type: application
    platform: iOS
    sources:
      - path: EmojiChat
      # The demo script lives with the Android twin's in app/fixtures; bundle it, don't copy it.
      - path: ../fixtures/demo_conversation.json
        buildPhase: resources
    dependencies:
      - package: EmojiModel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.framna.emojichat
        PRODUCT_NAME: EmojiChat
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Emoji Chat
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
