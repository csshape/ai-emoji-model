<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emoji-model · status</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  :root {
    --ground:#f6f7f9; --surface:#fff; --sunken:#eef1f5;
    --ink:#161a21; --ink-2:#444d5b; --muted:#6b7480; --hairline:#dde2e9;
    --accent:#1668b8; --good:#15803d; --idle:#9aa3b0;
    --display:"Archivo","Helvetica Neue",Arial,sans-serif;
    --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
    --mono:"IBM Plex Mono","SF Mono",Menlo,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:#101318; --surface:#181c23; --sunken:#1f242c;
      --ink:#e7eaef; --ink-2:#b7c0cc; --muted:#939cab; --hairline:#2a313b;
      --accent:#57a0e2; --good:#57b177; --idle:#5a6472;
    }
  }
  :root[data-theme="dark"] {
    --ground:#101318; --surface:#181c23; --sunken:#1f242c;
    --ink:#e7eaef; --ink-2:#b7c0cc; --muted:#939cab; --hairline:#2a313b;
    --accent:#57a0e2; --good:#57b177; --idle:#5a6472;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--ground); color:var(--ink); font-family:var(--body);
         font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:760px; margin:0 auto; padding-inline:20px; padding-block:34px 60px; }
  h1 { font-family:var(--display); font-size:clamp(24px,4.5vw,32px); font-weight:700;
       letter-spacing:-0.022em; margin:0 0 4px; }
  .eyebrow { font-family:var(--mono); font-size:11px; letter-spacing:0.14em;
             text-transform:uppercase; color:var(--muted); margin:0 0 10px; }
  .sub { color:var(--ink-2); margin:0; }

  .jobs { display:flex; flex-wrap:wrap; gap:10px; margin-top:24px; }
  .job { display:inline-flex; align-items:center; gap:9px; background:var(--surface);
         border:1px solid var(--hairline); border-radius:100px; padding:7px 15px;
         font-size:13.5px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--idle); flex:none; }
  .job.on .dot { background:var(--good); }
  @media (prefers-reduced-motion: no-preference) {
    .job.on .dot { animation:pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
  }

  .card { background:var(--surface); border:1px solid var(--hairline);
          border-radius:3px; padding:20px; margin-top:16px; }
  .card h2 { font-family:var(--display); font-size:15px; font-weight:600; margin:0 0 14px;
             display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  .card h2 span { font-family:var(--mono); font-size:11.5px; font-weight:400; color:var(--muted); }

  .bar { height:8px; background:var(--sunken); border-radius:100px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--accent); border-radius:100px;
           transition:width .4s ease; }
  .meta { display:flex; justify-content:space-between; font-family:var(--mono);
          font-size:11.5px; color:var(--muted); margin-top:7px;
          font-variant-numeric:tabular-nums; }

  svg { display:block; width:100%; height:auto; margin-top:6px; }
  .empty { color:var(--muted); font-size:13.5px; }
  footer { margin-top:28px; font-family:var(--mono); font-size:11.5px; color:var(--muted); }
  a { color:var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Opdaterer hvert 10. sekund</p>
  <h1>Emoji-model · status</h1>
  <p class="sub">Hvad der kører på maskinen lige nu.</p>

  <div class="jobs" id="jobs"></div>
  <div id="cards"></div>

  <footer>
    <span id="stamp">henter…</span> ·
    <a href="./test.html">prøvestanden</a> ·
    <a href="./diagnose.html">diagnosen</a>
  </footer>
</div>

<script>
const $ = id => document.getElementById(id);

function curve(epochs) {
  if (epochs.length < 2) return "";
  const W = 560, H = 150, L = 42, R = 14, T = 14, B = 26;
  const rs = epochs.map(e => e.recall);
  const lo = Math.min(...rs) - 0.01, hi = Math.max(...rs) + 0.01;
  const x = i => L + i * (W - L - R) / Math.max(epochs.length - 1, 1);
  const y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  let g = "";
  for (const v of [lo, (lo + hi) / 2, hi]) {
    g += `<line x1="${L}" y1="${y(v).toFixed(1)}" x2="${W - R}" y2="${y(v).toFixed(1)}"
           stroke="var(--hairline)" stroke-width="1"/>
          <text x="${L - 8}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end" fill="var(--muted)"
           font-family="IBM Plex Mono, monospace" font-size="10">${v.toFixed(3).replace(".", ",")}</text>`;
  }
  g += `<polyline points="${epochs.map((e, i) => `${x(i).toFixed(1)},${y(e.recall).toFixed(1)}`).join(" ")}"
         fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>`;
  const last = epochs.length - 1;
  g += `<circle cx="${x(last).toFixed(1)}" cy="${y(rs[last]).toFixed(1)}" r="4.5"
         fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
        <text x="${x(last).toFixed(1)}" y="${(y(rs[last]) - 11).toFixed(1)}" text-anchor="end"
         fill="var(--ink)" font-family="IBM Plex Mono, monospace" font-size="11"
         font-weight="600">${rs[last].toFixed(3).replace(".", ",")}</text>
        <text x="${L}" y="${H - 7}" fill="var(--muted)" font-family="IBM Plex Mono, monospace"
         font-size="10">epoch 1</text>
        <text x="${W - R}" y="${H - 7}" text-anchor="end" fill="var(--muted)"
         font-family="IBM Plex Mono, monospace" font-size="10">${epochs.length}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img"
           aria-label="Valideringskurve, seneste recall@5 ${rs[last].toFixed(3)}">${g}</svg>`;
}

function bar(done, total, label) {
  const pct = Math.min(100, 100 * done / total);
  return `<div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div>
          <div class="meta"><span>${label}</span>
          <span>${done.toLocaleString("da-DK")} / ${total.toLocaleString("da-DK")} · ${pct.toFixed(1)}%</span></div>`;
}

async function tick() {
  let d;
  try {
    d = await (await fetch("./status.json?t=" + Date.now())).json();
  } catch {
    $("stamp").textContent = "ingen forbindelse — kører serveren i report/?";
    return;
  }

  $("jobs").innerHTML =
    `<span class="job ${d.jobs.training ? "on" : ""}"><i class="dot"></i>Træning ${d.jobs.training ? "kører" : "stille"}</span>` +
    `<span class="job ${d.jobs.relabelling ? "on" : ""}"><i class="dot"></i>Relabelling ${d.jobs.relabelling ? "kører" : "stille"}</span>`;

  let html = `<div class="card"><h2>Relabelling<span>ægte beskeder med ærlige labels</span></h2>
              ${bar(d.relabel.done, d.relabel.total, "danske eksempler")}</div>`;

  for (const [name, run] of Object.entries(d.runs)) {
    if (!run) continue;
    const n = run.epochs.length;
    const status = run.done ? `færdig · bedste ${run.best.toFixed(3).replace(".", ",")}`
      : run.step ? `epoch ${run.step.epoch} · step ${run.step.at} af ${run.step.of}`
      : "starter";
    html += `<div class="card"><h2>${name}<span>${status}</span></h2>`;
    html += n ? bar(n, 15, "epochs") + curve(run.epochs)
              : `<p class="empty">Ingen epochs endnu.</p>`;
    html += `</div>`;
  }
  $("cards").innerHTML = html;
  $("stamp").textContent = "opdateret " + d.updated;
}

tick();
setInterval(tick, 10000);
</script>
</body>
</html>
